services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: prueba_tecnica_imaginemos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__CadenaPostgre=Host=db;Port=5432;Database=PruebaTecnicaImaginemos;Username=postgres;Password=newpassword
    networks:
      - mynetwork

  db:
    image: postgres:latest
    container_name: postgresPTI
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newpassword
      POSTGRES_DB: PruebaTecnicaImaginemos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  postgres-data:






